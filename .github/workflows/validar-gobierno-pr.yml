name: Validar gobierno del PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validador-gob-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MARCA: "<!-- validador-gobierno -->"

jobs:
  gobierno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar plantilla del PR
        id: val
        continue-on-error: true
        run: python validators/validar_gobierno_pr.py

      - name: Publicar comentario unico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          ESTADO=$(jq -r '.estado_global' veredicto_gobierno.json)
          FECHA=$(TZ='America/Lima' date +"%d/%m/%Y %H:%M")

          {
            echo "$MARCA"
            echo "### Gobierno del PR: $ESTADO"
            echo ""
            jq -r 'if (.hallazgos|length) > 0
                   then (.hallazgos[] | "- **\(.regla_id)** (checklist \(.checklist_nro)) — \(.explicacion)")
                   else "- Plantilla del PR completa." end' veredicto_gobierno.json
            echo ""
            echo "<sub>Actualizado: $FECHA · [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > comentario_gob.md

          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.body | contains(\"$MARCA\"))] | last | .id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comentario_gob.md
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comentario_gob.md
          fi

      - name: Estado final del check
        if: always()
        run: |
          ESTADO=$(jq -r '.estado_global' veredicto_gobierno.json 2>/dev/null || echo "ERROR")
          echo "Veredicto: $ESTADO"
          [ "$ESTADO" = "APROBADO" ] || exit 1
