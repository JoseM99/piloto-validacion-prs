name: Validar desarrollo Lakehouse

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.ipynb'
      - '**.py'
      - '**.sql'
      - '**/workflows/**.json'
      - '**/pipeline/**.json'
      - '**/dataset/**.json'
      - 'config/catalogo_reglas.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validador-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MARCA: "<!-- validador-lakehouse-dev -->"
  TOPE_HALLAZGOS: 20
  TAREA_SALIDA: consolidar

jobs:
  desarrollo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nodo 1 - reglas deterministas
        id: nodo1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python validators/nodo1_desarrollo.py

      - name: Nodo 2 - revision con criterio
        id: nodo2
        continue-on-error: true
        env:
          HOST:  ${{ secrets.DATABRICKS_HOST }}
          TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          JOBID: ${{ secrets.DATABRICKS_JOB_ID_DEV }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          HOST="$(echo "$HOST" | tr -d '[:space:]')"; HOST="${HOST%/}"

          RUN_ID=$(curl -sS -X POST "$HOST/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --argjson job_id "$JOBID" --arg repo "$GITHUB_REPOSITORY" \
                   --arg pr "${{ github.event.pull_request.number }}" \
                   --arg tok "$GH_TOKEN" \
                   '{job_id:$job_id, notebook_params:{repo:$repo, pr_number:$pr, gh_token:$tok}}')" \
            | jq -r '.run_id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No se pudo disparar el Job de Databricks." > ia_motivo.txt
            echo "No se pudo disparar el Nodo 2"
            exit 0
          fi
          echo "Job disparado: run_id=$RUN_ID"

          RESP=""
          TERMINO="no"
          for i in $(seq 1 60); do
            RESP=$(curl -sS "$HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID" \
              -H "Authorization: Bearer $TOKEN")
            ST=$(echo "$RESP" | jq -r '.status.state // .state.life_cycle_state // "?"')
            echo "[$i] estado=$ST"
            case "$ST" in
              TERMINATED|INTERNAL_ERROR|SKIPPED|SUCCESS|FAILED) TERMINO="si"; break ;;
            esac
            sleep 10
          done

          if [ "$TERMINO" = "no" ]; then
            echo "La revision con criterio supero el tiempo de espera de 10 minutos." > ia_motivo.txt
            echo "Timeout esperando al Job"
            exit 0
          fi

          # La salida se toma de la tarea consolidadora POR NOMBRE. Con varias
          # tareas, tasks[0] es la determinista y no devuelve el veredicto.
          TRID=$(echo "$RESP" | jq -r --arg k "$TAREA_SALIDA" \
                   '(.tasks[]? | select(.task_key==$k) | .run_id) // empty' | head -1)
          if [ -z "$TRID" ]; then
            TRID=$(echo "$RESP" | jq -r '.tasks[-1].run_id // empty')
            echo "Tarea '$TAREA_SALIDA' no encontrada. Se usa la ultima tarea del Job."
          fi
          if [ -z "$TRID" ]; then TRID="$RUN_ID"; fi
          echo "Leyendo salida de la tarea run_id=$TRID"

          curl -sS "$HOST/api/2.1/jobs/runs/get-output?run_id=$TRID" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.notebook_output.result // empty' > salida.json

          if [ ! -s salida.json ]; then
            echo "La revision con criterio no devolvio resultado." > ia_motivo.txt
            echo "Sin salida del Job"
            rm -f salida.json
            exit 0
          fi

          # El consolidador devuelve los dos veredictos. Solo interesa el de criterio.
          if jq -e 'has("ia")' salida.json > /dev/null; then
            jq '{hallazgos: .ia, ia_ejecutada: .ia_ejecutada}' salida.json > ia.json
          else
            cp salida.json ia.json
          fi
          echo "Salida del Nodo 2 recibida"

      - name: Publicar comentario unico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          if [ ! -s veredicto_desarrollo.json ]; then
            echo "No hay veredicto. El validador no llego a ejecutarse."
            exit 0
          fi

          ESTADO=$(jq -r '.estado_global' veredicto_desarrollo.json)
          CATALOGO=$(jq -r '.catalogo' veredicto_desarrollo.json)
          CHECKLIST=$(jq -r '.checklist' veredicto_desarrollo.json)
          ARCHIVOS=$(jq '.archivos_evaluados | length' veredicto_desarrollo.json)
          OBL=$(jq '[.hallazgos[] | select(.criticidad=="OBL")] | length' veredicto_desarrollo.json)
          OPC=$(jq '[.hallazgos[] | select(.criticidad=="OPC")] | length' veredicto_desarrollo.json)
          FECHA=$(TZ='America/Lima' date +"%d/%m/%Y %H:%M")

          {
            echo "$MARCA"
            if [ "$ESTADO" = "APROBADO" ]; then
              echo "### Desarrollo Lakehouse: APROBADO"
            else
              echo "### Desarrollo Lakehouse: RECHAZADO"
            fi
            echo ""
            echo "Checklist \`$CHECKLIST\` · catalogo \`$CATALOGO\` · archivos evaluados: $ARCHIVOS"
            echo ""
            echo "| | Cantidad |"
            echo "| --- | --- |"
            echo "| Obligatorios (impiden la integracion) | $OBL |"
            echo "| Opcionales (no bloquean) | $OPC |"
            echo ""

            if [ "$OBL" -gt 0 ]; then
              echo "#### Debes corregir antes de continuar"
              echo ""
              jq -r --argjson tope "$TOPE_HALLAZGOS" '
                [.hallazgos[] | select(.criticidad=="OBL")]
                | group_by(.archivo)
                | map({archivo: .[0].archivo, items: .})
                | .[]
                | "**\(.archivo)**\n" +
                  (.items[:$tope]
                   | map("- **`\(.codigo)`**" +
                         (if .linea then " · linea \(.linea)" else "" end) +
                         "  \n  \(.mensaje)  \n  _\(.correccion)_" +
                         (if (.evidencia // "") != "" then "  \n  `\(.evidencia)`" else "" end))
                   | join("\n")) +
                  (if (.items | length) > $tope
                   then "\n- _… y \(.items | length - $tope) hallazgo(s) mas en el log del check._"
                   else "" end) + "\n"' veredicto_desarrollo.json
            fi

            if [ "$OPC" -gt 0 ]; then
              echo ""
              echo "<details><summary>Recomendaciones ($OPC · no bloquean el pase)</summary>"
              echo ""
              jq -r '
                [.hallazgos[] | select(.criticidad=="OPC")]
                | group_by(.archivo)
                | map({archivo: .[0].archivo, items: .})
                | .[]
                | "**\(.archivo)**\n" +
                  (.items | map("- `\(.codigo)`" +
                                (if .linea then " · linea \(.linea)" else "" end) +
                                " — \(.mensaje)") | join("\n")) + "\n"' veredicto_desarrollo.json
              echo ""
              echo "</details>"
            fi

            if [ "$OBL" -eq 0 ] && [ "$OPC" -eq 0 ]; then
              echo "Sin hallazgos deterministas."
            fi

            if [ -s ia.json ]; then
              IA_N=$(jq '.hallazgos | length' ia.json)
              echo ""
              echo "<details><summary>Revision con criterio ($IA_N · referencial, no bloquea)</summary>"
              echo ""
              jq -r 'if (.hallazgos|length) > 0
                     then (.hallazgos[] | "- `\(.codigo // .regla_id)` — \(.explicacion)  \n  `\((.evidencia // "") | gsub("[\\n\\r]+"; " ") | .[0:120])`  \n  _\(.archivo)_")
                     else "- Sin observaciones adicionales sobre las reglas de criterio." end' ia.json
              echo ""
              echo "</details>"
            elif [ -s ia_motivo.txt ]; then
              echo ""
              echo "_Revision con criterio no disponible: $(cat ia_motivo.txt)_"
            fi

            echo ""
            echo "<sub>Cada codigo corresponde a una validacion del Checklist $CHECKLIST del CoE Data & Analytics.</sub>"
            echo ""
            echo "<sub>Actualizado: $FECHA · [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > comentario.md

          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.body | contains(\"$MARCA\"))] | last | .id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comentario.md
            echo "Comentario $ID actualizado"
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comentario.md
            echo "Comentario creado"
          fi

      - name: Estado final del check
        if: always()
        run: |
          if [ ! -s veredicto_desarrollo.json ]; then
            echo "El validador no genero veredicto. Se considera no conforme."
            exit 1
          fi
          ESTADO=$(jq -r '.estado_global' veredicto_desarrollo.json)
          echo "Veredicto Nodo 1: $ESTADO"
          [ "$ESTADO" = "APROBADO" ] || exit 1
