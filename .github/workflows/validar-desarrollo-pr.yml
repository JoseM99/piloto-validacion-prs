name: Validar desarrollo Lakehouse

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.ipynb'
      - '**.py'
      - '**/pipelines/**.json'
      - '**/datasets/**.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validador-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MARCA: "<!-- validador-lakehouse-dev -->"
  TOPE_HALLAZGOS: 20

jobs:
  desarrollo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nodo 1 - reglas deterministas
        id: nodo1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python validators/nodo1_desarrollo.py

      - name: Nodo 2 - revision con IA (solo si Nodo 1 aprueba)
        id: nodo2
        if: steps.nodo1.outcome == 'success'
        continue-on-error: true
        env:
          HOST:  ${{ secrets.DATABRICKS_HOST }}
          TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          JOBID: ${{ secrets.DATABRICKS_JOB_ID_DEV }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          HOST="$(echo "$HOST" | tr -d '[:space:]')"; HOST="${HOST%/}"
          HALL=$(jq -c '[.hallazgos[] | {regla_id}]' veredicto_desarrollo.json)

          RUN_ID=$(curl -sS -X POST "$HOST/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --argjson job_id "$JOBID" --arg repo "$GITHUB_REPOSITORY" \
                   --arg pr "${{ github.event.pull_request.number }}" \
                   --arg tok "$GH_TOKEN" --arg h "$HALL" \
                   '{job_id:$job_id, notebook_params:{repo:$repo, pr_number:$pr, gh_token:$tok, hallazgos_nodo1:$h}}')" \
            | jq -r '.run_id // empty')

          if [ -z "$RUN_ID" ]; then echo "No se pudo disparar el Nodo 2"; exit 0; fi

          RESP=""
          for i in $(seq 1 60); do
            RESP=$(curl -sS "$HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID" \
              -H "Authorization: Bearer $TOKEN")
            ST=$(echo "$RESP" | jq -r '.status.state // .state.life_cycle_state // "?"')
            echo "[$i] estado=$ST"
            case "$ST" in TERMINATED|INTERNAL_ERROR|SKIPPED|SUCCESS|FAILED) break ;; esac
            sleep 10
          done

          TRID=$(echo "$RESP" | jq -r '.tasks[0].run_id // empty')
          if [ -z "$TRID" ]; then TRID="$RUN_ID"; fi

          curl -sS "$HOST/api/2.1/jobs/runs/get-output?run_id=$TRID" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.notebook_output.result // empty' > ia.json

          if [ ! -s ia.json ]; then echo "Sin salida del Nodo 2"; rm -f ia.json; exit 0; fi

      - name: Publicar comentario unico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          ESTADO=$(jq -r '.estado_global' veredicto_desarrollo.json)
          TOTAL=$(jq '.hallazgos | length' veredicto_desarrollo.json)
          ARCHIVOS=$(jq '.archivos_evaluados | length' veredicto_desarrollo.json)
          FECHA=$(TZ='America/Lima' date +"%d/%m/%Y %H:%M")

          {
            echo "$MARCA"
            echo "### Desarrollo Lakehouse: $ESTADO"
            echo ""
            echo "Skill: \`$(jq -r '.skill' veredicto_desarrollo.json)\` · archivos evaluados: $ARCHIVOS · hallazgos: $TOTAL"
            echo ""

            if [ "$TOTAL" -eq 0 ]; then
              echo "Sin hallazgos deterministas."
            else
              jq -r --argjson tope "$TOPE_HALLAZGOS" '
                .hallazgos
                | group_by(.archivo)
                | map({archivo: .[0].archivo, items: .})
                | .[]
                | "**\(.archivo)**\n" +
                  (.items[:$tope] | map("- `\(.regla_id)` · \(.criticidad) — \(.explicacion)  \n  `\(.evidencia)`") | join("\n")) +
                  (if (.items | length) > $tope
                   then "\n- _… y \(.items | length - $tope) hallazgo(s) mas en el log del check._"
                   else "" end) + "\n"' veredicto_desarrollo.json
            fi

            if [ -s ia.json ]; then
              echo ""
              echo "<details><summary>Revision con IA (referencial, no bloquea)</summary>"
              echo ""
              jq -r 'if (.hallazgos|length) > 0
                     then (.hallazgos[] | "- `\(.regla_id)` · \(.confianza // "?") — \(.explicacion)  \n  `\((.evidencia // "") | gsub("[\\n\\r]+"; " ") | .[0:120])`  \n  _\(.archivo)_")
                     else "- Sin observaciones adicionales." end' ia.json
              echo ""
              echo "</details>"
            elif [ "${{ steps.nodo1.outcome }}" != "success" ]; then
              echo ""
              echo "_La revision con IA se omite mientras existan hallazgos obligatorios._"
            fi

            echo ""
            echo "<sub>Actualizado: $FECHA · [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > comentario.md

          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.body | contains(\"$MARCA\"))] | last | .id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comentario.md
            echo "Comentario $ID actualizado"
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comentario.md
            echo "Comentario creado"
          fi

      - name: Estado final del check
        if: always()
        run: |
          ESTADO=$(jq -r '.estado_global' veredicto_desarrollo.json 2>/dev/null || echo "ERROR")
          echo "Veredicto Nodo 1: $ESTADO"
          [ "$ESTADO" = "APROBADO" ] || exit 1
