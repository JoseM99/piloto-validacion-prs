name: Validar PR - Lakehouse MiBanco

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sql'

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Job de Databricks
        id: disparo
        env:
          HOST:  ${{ secrets.DATABRICKS_HOST }}
          TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          JOBID: ${{ secrets.DATABRICKS_JOB_ID }}
          GHPAT: ${{ github.token }}
        run: |
          set -uo pipefail
          HOST="$(echo "$HOST" | tr -d '[:space:]')"; HOST="${HOST%/}"
          JOBID="$(echo "$JOBID" | tr -d '[:space:]')"
          TOKEN="$(echo "$TOKEN" | tr -d '[:space:]')"

          PAYLOAD=$(jq -n \
            --argjson job_id "$JOBID" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg tok "$GHPAT" \
            '{job_id:$job_id, notebook_params:{repo:$repo, pr_number:$pr, gh_token:$tok}}')

          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$HOST/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP=$CODE"

          RUN_ID=$(echo "$BODY" | jq -r '.run_id // empty' 2>/dev/null)
          if [ -z "$RUN_ID" ]; then
            echo "No se pudo disparar el Job"; echo "$BODY" | head -c 800; exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Esperar resultado
        id: espera
        env:
          HOST:   ${{ secrets.DATABRICKS_HOST }}
          TOKEN:  ${{ secrets.DATABRICKS_TOKEN }}
          RUN_ID: ${{ steps.disparo.outputs.run_id }}
        run: |
          set -uo pipefail
          HOST="$(echo "$HOST" | tr -d '[:space:]')"; HOST="${HOST%/}"
          TOKEN="$(echo "$TOKEN" | tr -d '[:space:]')"

          RESP=""
          for i in $(seq 1 90); do
            RESP=$(curl -sS "$HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID" \
              -H "Authorization: Bearer $TOKEN")
            STATE=$(echo "$RESP" | jq -r '.status.state // .state.life_cycle_state // "?"')
            echo "[$i] estado=$STATE"
            case "$STATE" in
              TERMINATED|INTERNAL_ERROR|SKIPPED|SUCCESS|FAILED) break ;;
            esac
            sleep 10
          done

          TASK_RUN_ID=$(echo "$RESP" | jq -r '.tasks[0].run_id // empty')
          if [ -z "$TASK_RUN_ID" ]; then TASK_RUN_ID="$RUN_ID"; fi
          echo "task_run_id=$TASK_RUN_ID"

          OUT=$(curl -sS "$HOST/api/2.1/jobs/runs/get-output?run_id=$TASK_RUN_ID" \
            -H "Authorization: Bearer $TOKEN")
          echo "$OUT" | jq -r '.notebook_output.result // empty' > veredicto.json

          if [ ! -s veredicto.json ]; then
            echo "El notebook no devolvio veredicto"
            echo "$OUT" | head -c 800
            exit 1
          fi
          jq . veredicto.json > /dev/null || { echo "veredicto.json no es JSON valido"; exit 1; }

      - name: Publicar veredicto en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ESTADO=$(jq -r '.estado_global' veredicto.json)
          SKILL=$(jq -r '.skill' veredicto.json)

          {
            echo "### Validacion de modelamiento: $ESTADO"
            echo ""
            echo "Skill aplicado: \`$SKILL\`"
            echo ""
            jq -r '.detalle[] |
              "**\(.path)** — \(.estado)\n" +
              (if (.hallazgos|length) > 0
               then (.hallazgos | map("- " + .) | join("\n"))
               else "- Sin observaciones de reglas duras." end) +
              "\n\n<details><summary>Revision con IA (referencial)</summary>\n\n" +
              (.revision_ia // "sin salida") + "\n\n</details>\n"' veredicto.json
          } > comentario.md

          gh pr comment "${{ github.event.pull_request.number }}" --body-file comentario.md

          if [ "$ESTADO" != "APROBADO" ]; then
            echo "PR rechazado por el validador"; exit 1
          fi
