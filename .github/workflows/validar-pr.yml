name: Validar PR - Lakehouse MiBanco

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sql'

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Job de Databricks
        id: disparo
        env:
          HOST:  ${{ secrets.DATABRICKS_HOST }}
          TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          JOBID: ${{ secrets.DATABRICKS_JOB_ID }}
          GHPAT: ${{ github.token }}
        run: |
          set -uo pipefail
          HOST="$(echo "$HOST" | tr -d '[:space:]')"
          HOST="${HOST%/}"
          JOBID="$(echo "$JOBID" | tr -d '[:space:]')"
          TOKEN="$(echo "$TOKEN" | tr -d '[:space:]')"
          echo "host_len=${#HOST} job_id=[$JOBID] token_len=${#TOKEN}"

          PAYLOAD=$(jq -n \
            --argjson job_id "$JOBID" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg tok "$GHPAT" \
            '{job_id:$job_id, notebook_params:{repo:$repo, pr_number:$pr, gh_token:$tok}}')

          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$HOST/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP=$CODE"
          echo "RESPUESTA: $BODY" | head -c 1000

          RUN_ID=$(echo "$BODY" | jq -r '.run_id // empty' 2>/dev/null)
          if [ -z "$RUN_ID" ]; then
            echo "No se pudo disparar el Job"; exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
